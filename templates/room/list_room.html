<section>

    {% for room in rooms %}

        <article>
            <h3> HABITACION {{ room.number }} </h3>
            <p> {{ room.preview }} </p>
            <p> Estado: {{ room.availability }} </p>
            <p> Precio: {{ room.price }} </h3>
            <button> <a href="{% url 'room:room_detail' room.pk %}"> VER DETALLES </a> </button>
        </article>

    {% endfor %}

</section>
