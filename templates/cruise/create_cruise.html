{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Cormorant:ital,wght@0,300..700;1,300..700&family=GFS+Didot&family=Instrument+Serif:ital@0;1&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'home/css/style.css' %}">

<h3 class="create-cruise"> CREAR NUEVO CRUCERO </h3>

<form method="POST" action="" enctype="multipart/form-data" class="cruise-create">
    {% csrf_token %}

    <div>
        <label for="{{ form.number.id_for_label }}"> NRO. DEL CRUCERO </label> <br>
        {{ form.number }}
    </div>
    <br>

    <div>
        <label for="{{ form.photo.id_for_label }}"> FOTO DEL CRUCERO </label> <br>
        {{ form.photo }}
    </div>
    <br>

    <div>
        <label for="{{ form.preview.id_for_label }}"> PREVIEW </label> <br>
        {{ form.preview }}
    </div>
    <br>

    <div>
        <label for="{{ form.description.id_for_label }}"> DESCRIPCION DEL CRUCERO </label> <br>
        {{ form.description }}
    </div>
    <br>

    <div>
        <label for="{{ form.rooms.id_for_label }}"> NRO. DE HABITACIONES </label> <br>
        {{ form.rooms }}
    </div>
    <br>

    <div>
        <label for="{{ form.availability.id_for_label }}"> DISPONIBILIDAD DEL CRUCERO </label> <br>
        {{ form.availability }}
    </div>
    <br>

    <div>
        <label for="{{ form.price.id_for_label }}"> PRECIO DEL CRUCERO </label> <br>
        {{ form.price }}
    </div>
    <br>

    <button type="submit" class="new-cruise"> CREAR CRUCERO </button>
</form>
