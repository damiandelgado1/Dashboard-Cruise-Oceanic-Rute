<section>

    {% for cruise in cruises %}

        <article>
            <h3> CRUCERO {{ cruise.number }} </h3>
            <p> {{ cruise.preview }} </p>
            <p> Estado: {{ cruise.availability }} </p>
            <p> Precio: {{ cruise.price }} </p> <br>
            <button> <a href="{% url 'cruise:cruise_detail' cruise.pk %}"> VER DETALLES </a> </button>
        </article>

    {% endfor %}

</section>
